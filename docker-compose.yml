services:
  # Emulated plant: the simulator physics behind Modbus TCP (no hardware). The Modbus port has
  # writable attack-surface registers and no authentication, so it is published on loopback only.
  plant-emulator:
    build:
      context: .
      dockerfile: plant_emulator/Dockerfile
    environment:
      EMU_SEED: ${AT_SEED:-42}
    ports:
      - "127.0.0.1:5020:5020"
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    ports: ["127.0.0.1:8000:8000"]
    environment:
      AT_HOST: "0.0.0.0"  # Non-loopback container binding; private authentication is enabled below.
      AT_HAI_DIR: /data/hai
      AT_REPORTS_DIR: /reports
      AT_LIVE_HOST: plant-emulator
      AT_LIVE_TAGMAP: /config/tagmap.yaml
      AT_LIVE_DB: /data/live/incidents.sqlite
      AT_SOC_DB: /data/live/investigations.sqlite
      AT_AUTH_ENABLED: "true"  # Local .env must not disable the private deployment boundary.
      AT_FIREBASE_PROJECT_ID: attacktrace-private-20261016
      AT_AUTH_COOKIE_SECURE: "true"
      AT_DEMO_MODE: "false"
    volumes:
      - ./data/hai:/data/hai:ro
      - ./reports:/reports
      - ./config:/config:ro
      - ./data/live:/data/live
      # Trained detectors persist here, so only the very first start trains (about a minute including the metrics).
      - ./backend/models:/app/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health", timeout=3)
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 360s
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_KEY: ""  # Private access uses server sessions, never a bundled demo key.
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend:
        condition: service_healthy
